<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mdpad</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header class="toolbar" data-tauri-drag-region>
      <div class="group segmented" id="view-modes">
        <button data-mode="editor" class="active">源码</button>
        <button data-mode="split">分栏</button>
        <button data-mode="preview">预览</button>
      </div>
      <div class="spacer" data-tauri-drag-region></div>
      <button id="btn-ai-settings" title="AI 设置">AI</button>
      <div class="meta" id="meta">—</div>
    </header>

    <main class="workspace" id="workspace">
      <section class="pane editor-pane">
        <div id="editor"></div>
      </section>
      <div class="divider" id="divider"></div>
      <section class="pane preview-pane">
        <article class="markdown-body" id="preview"></article>
      </section>
      <div class="divider" id="chat-divider" hidden></div>
      <aside class="chat-pane" id="chat-panel" hidden>
        <header id="chat-header">
          <span id="chat-title">AI 对话</span>
          <span class="spacer"></span>
          <button id="chat-clear" title="清空对话">清空</button>
          <button id="chat-close" title="关闭">×</button>
        </header>
        <div id="chat-messages"></div>
        <div id="chat-input-area">
          <div id="chat-context">
            <button id="ctx-sel" class="chip active">附带选区</button>
            <button id="ctx-doc" class="chip">附带全文</button>
          </div>
          <textarea id="chat-input" placeholder="输入消息，⌘Enter 发送" rows="3"></textarea>
          <div id="chat-actions">
            <button id="chat-stop" hidden>停止</button>
            <span class="spacer"></span>
            <button id="chat-send" class="primary">发送 ⌘↵</button>
          </div>
        </div>
      </aside>
    </main>

    <div id="ai-bar" hidden>
      <button data-action="expand">扩写</button>
      <button data-action="summarize">总结</button>
      <button data-action="polish">润色</button>
    </div>

    <aside id="ai-drawer" hidden>
      <header>
        <span id="ai-drawer-title">AI</span>
        <span class="spacer"></span>
        <span id="ai-drawer-status"></span>
        <button id="ai-stop" hidden>停止</button>
        <button id="ai-close" title="关闭">×</button>
      </header>
      <div id="ai-output" class="markdown-body"></div>
      <footer>
        <button id="ai-replace">替换选区</button>
        <button id="ai-insert-after">插入到选区后</button>
        <button id="ai-copy">复制</button>
      </footer>
    </aside>

    <div id="ai-settings-overlay" hidden>
      <div id="ai-settings">
        <h2>AI 设置</h2>
        <label>
          服务商 <span class="hint" id="ai-active-hint"></span>
          <select id="ai-preset">
            <option value="ollama">Ollama（本地）</option>
            <option value="lmstudio">LM Studio（本地）</option>
            <option value="deepseek">DeepSeek</option>
            <option value="zhipu">智谱 GLM</option>
            <option value="minimax">MiniMax</option>
            <option value="kimi">Kimi（月之暗面）</option>
            <option value="dashscope">通义千问（百炼）</option>
            <option value="volcengine">豆包（火山方舟）</option>
            <option value="openai">OpenAI</option>
            <option value="custom">自定义 OpenAI 兼容端点</option>
          </select>
        </label>
        <label>
          接口地址
          <input id="ai-base-url" placeholder="http://localhost:11434/v1" spellcheck="false" />
        </label>
        <label>
          API Key
          <div class="key-row">
            <input id="ai-api-key" type="password" placeholder="" spellcheck="false" autocomplete="off" />
            <button id="ai-key-toggle" class="link-btn" type="button" title="显示或隐藏">显示</button>
          </div>
          <span class="hint" id="ai-key-hint"></span>
          <button id="ai-key-clear" class="link-btn" hidden>清除已保存的 Key</button>
        </label>
        <label>
          模型
          <input id="ai-model" list="ai-model-list" placeholder="qwen3.8:27b-mlx" spellcheck="false" />
          <datalist id="ai-model-list"></datalist>
          <select id="ai-model-select" hidden></select>
          <span class="hint" id="ai-model-hint"></span>
        </label>
        <div class="row">
          <button id="ai-fetch-models">拉取模型列表</button>
          <button id="ai-view-log">查看日志</button>
          <span id="ai-settings-status"></span>
        </div>
        <div class="row right">
          <button id="ai-settings-cancel">取消</button>
          <button id="ai-settings-save" class="primary">保存并使用</button>
        </div>
      </div>
    </div>

    <div class="empty-hint" id="empty-hint" hidden>拖一个 .md 文件进来</div>
  </body>
</html>
